# -----------------------------------------------------------------------------
# Continuous integration: every pull request, and the quality gate of the
# Release workflow (workflow_call) on every push to main. No `push` trigger of
# its own on main: release.yml runs it there, so a release is never cut from a
# commit whose checks failed.
#
#   1. Prettier, ESLint and the tests, on Node 22 (the oldest version
#      `engines` accepts) and Node 24 (the one the image ships with);
#   2. the store admission checks, without the image check (the image of a
#      version only exists once it is released);
#   3. the Docker image, built for amd64 and never pushed, then started like
#      Gladys runs it: a broken Dockerfile or a module that does not load
#      shows up here rather than in a release.
# -----------------------------------------------------------------------------
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Checks only read the code: no write scope for the token.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  store:
    runs-on: ubuntu-latest
    name: Store admission checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: Validate the manifest, the cover and the docs
        run: npx --yes github:GladysAssistant/integration-store . --skip-image-check

  docker:
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same build as build.yml, without pushing, and for amd64 only: emulating
      # arm64 is slow, and only the release build needs it.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: gladys-adax:ci

      # The image as Gladys runs it (read-only, unprivileged, 256 MB, no
      # network): every module loads, a room whose heaters report their
      # energy becomes a device of 6 features (setpoint, heating on / off,
      # temperature, heating now, power, energy index) and one whose heaters
      # do not a device of 3, /data/state.json is written with mode 0600.
      # Update the counts with the features.
      - name: Smoke test of the image
        run: |
          set -euo pipefail
          docker run --rm --read-only --memory 256m --network none --user node \
            --tmpfs /data:uid=1000,gid=1000 --entrypoint node gladys-adax:ci \
            --input-type=module -e "
              const { createApp } = await import('/app/src/app.js');
              const { parseContent } = await import('/app/src/adax.js');
              const { buildDevice } = await import('/app/src/device.js');
              const { createState } = await import('/app/src/state.js');
              const { statSync } = await import('node:fs');
              const ids = { externalIds: (type, id) => ({ device: 'ext:adax:' + type + ':' + id, feature: (key) => 'ext:adax:' + type + ':' + id + ':' + key }) };
              const [withEnergy, withoutEnergy] = parseContent({
                homes: [{ id: 1, name: 'Home' }],
                rooms: [
                  { id: 10, homeId: 1, name: 'Living room', heatingEnabled: true, targetTemperature: 2100, temperature: 1980 },
                  { id: 11, homeId: 1, name: 'Bedroom', heatingEnabled: false, targetTemperature: 1700, temperature: 1850 },
                ],
                devices: [
                  { id: 100, homeId: 1, roomId: 10, name: 'Heater', type: 'Heater', energyWh: 120, energyTime: Date.now() },
                  { id: 101, homeId: 1, roomId: 11, name: 'Heater', type: 'Heater' },
                ],
              });
              const room = buildDevice(ids, withEnergy);
              const plain = buildDevice(ids, withoutEnergy);
              const state = createState({ path: '/data/state.json' });
              state.setSnapshot('10', { heating: true, target: 21 });
              state.save();
              const mode = statSync('/data/state.json').mode & 0o777;
              if (typeof createApp !== 'function' || room.features.length !== 6 || plain.features.length !== 3 || mode !== 0o600 || typeof fetch !== 'function') {
                process.exit(1);
              }
              console.log('modules load, 6 features for a room with energy, 3 without, /data/state.json is 0600');
            "
