<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Adax integration for Gladys Assistant (illustration, no
       Adax logo): a Nordic room with a slim panel heater on the wall, the
       room card of Gladys and the energy of the day. Built into cover.jpg by
       scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1ea"/>
      <stop offset="1" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceff3"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7dcef"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#f29d38" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f29d38" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>

  <!-- wooden floor -->
  <rect y="446" width="800" height="88" fill="#dcc7ad"/>
  <g stroke="#cdb595" stroke-width="3">
    <path d="M0 476 H800"/>
    <path d="M0 506 H800"/>
    <path d="M120 446 V476 M380 476 V506 M610 446 V476 M260 506 V534 M700 506 V534"/>
  </g>

  <!-- window on a snowy landscape -->
  <g transform="translate(56 92)">
    <rect width="190" height="250" rx="8" fill="#ffffff" stroke="#cfd7e1" stroke-width="6"/>
    <rect x="14" y="14" width="162" height="222" fill="url(#snow)"/>
    <path d="M14 190 L 60 150 L 96 178 L 140 132 L 176 168 V 236 H 14 Z" fill="#ffffff"/>
    <g fill="#5f7f68">
      <path d="M44 196 l 12 -34 l 12 34 Z"/>
      <path d="M126 186 l 14 -40 l 14 40 Z"/>
    </g>
    <g fill="#ffffff">
      <circle cx="40" cy="44" r="4"/>
      <circle cx="92" cy="70" r="3"/>
      <circle cx="148" cy="40" r="4"/>
      <circle cx="120" cy="96" r="3"/>
      <circle cx="62" cy="112" r="3"/>
    </g>
    <rect x="93" y="14" width="4" height="222" fill="#cfd7e1"/>
  </g>

  <!-- slim panel heater on the wall, with its warmth -->
  <ellipse cx="420" cy="350" rx="230" ry="110" fill="url(#warm)"/>
  <g transform="translate(270 330)">
    <rect width="300" height="96" rx="10" fill="url(#panel)" stroke="#c6ced8" stroke-width="3"/>
    <g stroke="#dde3ea" stroke-width="3">
      <path d="M24 14 H276 M24 26 H276"/>
    </g>
    <!-- display and button -->
    <rect x="226" y="44" width="52" height="30" rx="6" fill="#1f2d3d"/>
    <text x="252" y="66" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffb15c">21</text>
    <circle cx="204" cy="59" r="7" fill="#ffffff" stroke="#9aa6b2" stroke-width="3"/>
    <!-- feet -->
    <rect x="40" y="96" width="14" height="20" fill="#b9c2cc"/>
    <rect x="246" y="96" width="14" height="20" fill="#b9c2cc"/>
  </g>
  <g stroke="#f29d38" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M330 312 q -10 -16 0 -32 t 0 -32"/>
    <path d="M410 312 q -10 -16 0 -32 t 0 -32"/>
    <path d="M490 312 q -10 -16 0 -32 t 0 -32"/>
  </g>

  <!-- the room card -->
  <g transform="translate(492 76)">
    <rect width="262" height="148" rx="20" fill="url(#card)" stroke="#d6dde6" stroke-width="2"/>
    <path d="M34 62 L 58 40 L 82 62 V 90 H 34 Z" fill="none" stroke="#2a5ea8" stroke-width="6" stroke-linejoin="round"/>
    <text x="100" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="700" fill="#1f2d3d">21 °C</text>
    <rect x="34" y="104" width="96" height="30" rx="15" fill="#e3eefb"/>
    <text x="82" y="125" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#2a5ea8">19.8 °C</text>
    <rect x="140" y="104" width="96" height="30" rx="15" fill="#fdecd8"/>
    <text x="188" y="125" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#b4610f">1.2 kW</text>
  </g>

  <!-- the energy of the day -->
  <g transform="translate(560 244)">
    <rect width="194" height="78" rx="16" fill="url(#card)" stroke="#d6dde6" stroke-width="2"/>
    <g fill="#5b9bd5">
      <rect x="18" y="46" width="12" height="16" rx="2"/>
      <rect x="36" y="38" width="12" height="24" rx="2"/>
      <rect x="54" y="26" width="12" height="36" rx="2"/>
      <rect x="72" y="32" width="12" height="30" rx="2"/>
      <rect x="90" y="18" width="12" height="44" rx="2"/>
    </g>
    <text x="114" y="48" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2d3d">kWh</text>
  </g>

  <!-- title -->
  <text x="56" y="400" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="700" fill="#1f2d3d">Adax</text>
  <text x="56" y="430" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#4a5a6c">for Gladys Assistant</text>
</svg>
